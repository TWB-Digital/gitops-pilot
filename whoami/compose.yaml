# Canary 1: image-digest rollout. A PR that changes the image line is the approval.
name: gitops-pilot-whoami
services:
  whoami:
    image: traefik/whoami:v9.9.9-s8-does-not-exist
    command: ["--port", "8080", "--name", "gitops-pilot-whoami"]
    restart: unless-stopped
    # tuejon has no free Docker address pools: stay on the default bridge, create no network.
    network_mode: bridge
    ports:
      - "127.0.0.1:8191:8080"
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels:
      twb.owner: gitops-p2a-pull-pilot-tuejon

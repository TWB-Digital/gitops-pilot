# Live copy: tuejon /opt/gitops-pilot/doco-cd/compose.yml, project gitops-pilot-cd.
# Standalone install (not self-updating): updated by hand after review.
# Frozen during the pilot: any edit here, in poll.yml or in /opt/gitops-pilot/env is
# recorded in the workbench evidence log, because it can redeploy at an unchanged commit.
name: gitops-pilot-cd
services:
  # Enforcing Docker API filter: per-method path allowlists, bind sources limited to
  # doco-cd's own data volume. No exec, build, image/volume/network deletion or prune.
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    group_add: ["112"]  # tuejon docker group, for /var/run/docker.sock
    command:
      - '-loglevel=INFO'
      - '-listenip=0.0.0.0'
      - '-allowfrom=doco-cd'
      - '-allowhealthcheck'
      - '-watchdoginterval=300'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
      - '-allowHEAD=^(/v1\.[0-9]+)?/_ping$$'
      - '-allowGET=^(/v1\.[0-9]+)?/(_ping|version|info|events|containers/json|containers/[^/]+/json|images/json|images/.+/json|distribution/.+/json|networks|networks/[^/]+|volumes|volumes/[^/]+)$$'
      - '-allowPOST=^(/v1\.[0-9]+)?/(images/create|containers/create|containers/[^/]+/(start|stop|restart|kill|rename|wait)|networks/create|networks/[^/]+/(connect|disconnect)|volumes/create)$$'
      - '-allowDELETE=^(/v1\.[0-9]+)?/containers/[^/]+$$'
      - '-allowbindmountfrom=/var/lib/docker/volumes/gitops-pilot-cd_data/_data'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cd]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels:
      twb.owner: gitops-p2a-pull-pilot-tuejon

  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.131.0@sha256:33761af0adb58696bf7892604a4a319cee6164aa5cb17e5b4b4f5c8cb248a603
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      TZ: Europe/Vienna
      LOG_LEVEL: info
      DOCKER_HOST: tcp://socket-proxy:2375
      POLL_CONFIG_FILE: /config/poll.yml
      SCHEDULER_ENABLED: "false"
      METRICS_PORT: 9120
      MAX_CONCURRENT_DEPLOYMENTS: 1
      MAX_CONCURRENT_PREDEPLOYMENTS: 1
    ports:
      - "127.0.0.1:9191:9120"
    volumes:
      - data:/data
      - ./poll.yml:/config/poll.yml:ro
      - /opt/gitops-pilot/env:/opt/gitops-pilot/env:ro
    networks: [cd]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256
    healthcheck:
      start_period: 15s
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    labels:
      twb.owner: gitops-p2a-pull-pilot-tuejon

networks:
  cd: {}

volumes:
  data: {}

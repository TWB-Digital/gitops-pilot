# Live copy: tuejon /opt/gitops-pilot/doco-cd/compose.yml, project gitops-pilot-cd.
# Standalone install (not self-updating): updated by hand after review.
name: gitops-pilot-cd
services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      EVENTS: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      DISTRIBUTION: 1
      POST: 1
      DELETE: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cd]
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels:
      twb.owner: gitops-p2a-pull-pilot-tuejon

  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.131.0@sha256:33761af0adb58696bf7892604a4a319cee6164aa5cb17e5b4b4f5c8cb248a603
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      TZ: Europe/Vienna
      LOG_LEVEL: info
      DOCKER_HOST: tcp://socket-proxy:2375
      POLL_CONFIG_FILE: /config/poll.yml
      SCHEDULER_ENABLED: "false"
      METRICS_PORT: 9120
    ports:
      - "127.0.0.1:9191:9120"
    volumes:
      - data:/data
      - ./poll.yml:/config/poll.yml:ro
      - /opt/gitops-pilot/env:/opt/gitops-pilot/env:ro
    networks: [cd]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      start_period: 15s
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    labels:
      twb.owner: gitops-p2a-pull-pilot-tuejon

networks:
  cd: {}

volumes:
  data: {}
